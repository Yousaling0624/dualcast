name: CI

on:
  # push main 的构建 / 测试由 deploy-pages.yml 统一负责，这里只做 PR 检查
  pull_request:
    paths:
      - 'sanlu-pwa/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/deploy-pages.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check release script syntax
        run: bash -n .github/scripts/release-notes.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sanlu-pwa/package-lock.json

      - name: Install dependencies
        working-directory: sanlu-pwa
        run: npm ci

      - name: Type check
        working-directory: sanlu-pwa
        run: npm run typecheck

      - name: Unit tests
        working-directory: sanlu-pwa
        run: npm test

      - name: Build
        working-directory: sanlu-pwa
        run: npm run build
