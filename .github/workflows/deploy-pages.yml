name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'sanlu-pwa/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sanlu-pwa/package-lock.json

      - name: Install dependencies
        working-directory: sanlu-pwa
        run: npm ci

      - name: Type check
        working-directory: sanlu-pwa
        run: npm run typecheck

      - name: Build
        working-directory: sanlu-pwa
        env:
          # 项目站点固定部署在 https://<user>.github.io/<repo>/
          VITE_BASE: "/${{ github.event.repository.name }}/"
          # 可在仓库 Settings → Variables 覆盖中转地址；不设置则用默认 EdgeOne 中转
          VITE_RELAY_URL: "${{ vars.VITE_RELAY_URL || 'https://relay.yousaling.dpdns.org' }}"
        run: npm run build

      - name: Prepare Pages artifact
        working-directory: sanlu-pwa
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sanlu-pwa/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4